name: Feature or change
description: Something new, or a change to how the server plays
labels: [enhancement]
body:
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - RPG survival (classes)
        - Classic survival
        - Lobby
        - Build server
        - Whole network
        - Website or radio
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe it from a player's point of view.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or who asked for it.
  - type: textarea
    id: notes
    attributes:
      label: Details, limits, examples
      description: Numbers, plugins you have in mind, things it must NOT affect (e.g. "classic only").
