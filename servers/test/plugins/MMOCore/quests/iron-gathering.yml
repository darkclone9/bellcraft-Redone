lore:
- 'Cold ferrous bands wind deep through the subterranean strata.'
- 'Every blade in the armory begins as rough ore pried from'
- 'the silent dark.'
- ''
- '&6Objective:'
- '&7► Mine 16 Iron Ore from underground veins'
- ''
- '&eRewards:'
- '&7► 170 EXP'
- '&7► 8 Gold Coins'

parent: []

