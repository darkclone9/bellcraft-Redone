lore:
- 'The rattle of dry joints and the twang of notched sinew'
- 'disturb the quiet twilight. Keep the roadways safe from'
- 'snipers among the pines.'
- ''
- '&6Objective:'
- '&7► Defeat 8 Skeletons roaming the wilderness'
- ''
- '&eRewards:'
- '&7► 170 EXP'
- '&7► 8 Gold Coins'

parent: []

