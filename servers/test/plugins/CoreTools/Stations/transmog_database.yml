# You can create restriction lists containing as many materials,
# plugins, item IDs, and item types (from MMOItems)
# as you want to define which skins can be applied to which items.
#
# After creating your lists, you need to add them
# to the skin settings as shown in the example below.
#
# material_list=main_hand_materials
# plugin_list=my_plugin_list
# id_list=my_id_list
# type_list=my_type_list #MMOItems only
#
# - item3{.......;material_list=main_hand_materials;.....}
#
# `id_list` and `type_list` must always be used together with `plugin_list`.

restriction:
  main_hand_materials:
    - iron_sword
    - stone_sword
    - wooden_sword
    - golden_sword
    - diamond_sword
    - netherite_sword
  off_hand_materials: [shield]
  helmet_materials: [chainmail_helmet,iron_helmet,golden_helmet,diamond_helmet,netherite_helmet,player_head,carved_pumpkin]
  chestplate_materials: [chainmail_chestplate,iron_chestplate,golden_chestplate,diamond_chestplate,netherite_chestplate]
  leggings_materials: [chainmail_leggings,iron_leggings,golden_leggings,diamond_leggings,netherite_leggings]
  boots_materials: [chainmail_boots,iron_boots,golden_boots,diamond_boots,netherite_boots]

    # my_plugin_list:
    # - mmoitems
    # - nexo
    # - vanilla
    # my_id_list:
    # - long_sword
    # - cutlass
    # - falcon_blade
    # my_type_list:
    # - sword
    # - spear

# This setting is only relevant to MMOProfiles users.
# If you are not using MMOProfiles, leave it as false.
# If you are using it, please refer to the wiki for detailed information.
mmoprofiles_account: false

# Category lists allow you to configure which categories your
# existing skin items will be displayed in based on their materials.
category_list:
  helmet: [leather_helmet,chainmail_helmet,iron_helmet,golden_helmet,diamond_helmet,netherite_helmet,player_head,carved_pumpkin]
  chestplate: [leather_chestplate,chainmail_chestplate,iron_chestplate,golden_chestplate,diamond_chestplate,netherite_chestplate]
  leggings: [leather_leggings,chainmail_leggings,iron_leggings,golden_leggings,diamond_leggings,netherite_leggings]
  boots: [leather_boots,chainmail_boots,iron_boots,golden_boots,diamond_boots,netherite_boots]
  main_hand: [wooden_sword,iron_sword]
  off_hand: [shield]

