# This is the Bukkit commands configuration file for Paper.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/bukkit-commands-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  guide:
  - cmi dialogs guide $1-
  servers:
  - cmi dialogs guideservers $1-
  
  quests:
  - mmocore:quests
  q:
  - mmocore:quests
  journal:
  - mmocore:quests
  icanhasbukkit:
  - version $1-
# /sell disabled: the EconomyShopGUI-Premium jar is not installed, so this
# alias pointed at a command that does not exist and failed on every startup.
# To restore, drop the purchased jar in plugins/ and uncomment the two lines below.
# sell:
# - economyshopgui-premium:sellall $1-
