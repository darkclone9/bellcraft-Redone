# ---------------------------------------------------------------------------
# Optional PR #51 alias TypeIds (thin Templates) — only if something still
# summons NecromancerElite / NecromancerMinion by the old logical names.
# Prefer summoning NecroReaperElite / NecroMinionSkulker|Wretch directly.
# ---------------------------------------------------------------------------
NecromancerElite:
  Template: NecroReaperElite

NecromancerMinion:
  Template: NecroMinionSkulker
