# Acquire nearest living prey (players + animals + hostiles)
SculklingAcquireTarget:
  Cooldown: 1
  Skills:
  - settarget @EntitiesInRadius{r=20;limit=1;sort=NEAREST}

# Spit bolt — must use long duration (d is ticks!), hnp=true to hit pigs, syo so it doesn't spawn in the floor
SculklingSpit:
  Cooldown: 1.8
  Conditions:
  - targetwithin{d=18} true
  Skills:
  - state{s=sniff;li=0;lo=0} @self
  - effect:sound{s=block.sculk.spread;v=0.9;p=1.4} @self
  - projectile{onTick=SculklingSpitTick;onHit=SculklingSpitHit;onHitBlock=SculklingSpitBlock;v=14;i=1;hR=1.1;vR=1.1;sE=true;sB=true;hnp=true;hp=true;syo=0.9;sfo=0.6;tyo=0.5;g=0.04;d=100;mr=22} @target

SculklingSpitTick:
  Skills:
  - effect:particles{p=sculk_soul;amount=5;speed=0.01;hS=0.08;vS=0.08} @origin
  - effect:particles{p=sculk_charge_pop;amount=1;speed=0} @origin

SculklingSpitHit:
  Skills:
  - damage{a=2}
  - effect:particles{p=sculk_soul;amount=18;hS=0.5;vS=0.4;speed=0.05} @origin
  - effect:sound{s=block.sculk_sensor.clicking;v=0.8;p=0.8} @origin
  - setblock{material=SCULK_VEIN[down=true]} @Origin{y=-1}

SculklingSpitBlock:
  Skills:
  - effect:particles{p=sculk_charge_pop;amount=10;hS=0.3;vS=0.2;speed=0.03} @origin
  - setblock{material=SCULK_VEIN[down=true]} @Origin{y=1}

SculkCreeperPrime:
  Cooldown: 3
  Conditions:
  - targetwithin{d=4} true
  Skills:
  - state{s=swell;li=0;lo=0} @self
  - effect:particles{p=sculk_soul;amount=10;hS=0.45;vS=0.5;speed=0.02} @self
  - effect:sound{s=entity.creeper.primed;v=1;p=0.75} @self

SculkCreeperSpread:
  Skills:
  - effect:particles{p=sculk_soul;amount=50;hS=2.2;vS=1.2;speed=0.08} @self
  - effect:particles{p=sculk_charge_pop;amount=30;hS=2.0;vS=0.8;speed=0.1} @self
  - effect:sound{s=block.sculk.spread;v=1.2;p=0.7} @self
  - setblock{material=SCULK} @SelfLocation{y=-1}
  - setblock{material=SCULK} @SelfLocation{x=1;y=-1}
  - setblock{material=SCULK} @SelfLocation{x=-1;y=-1}
  - setblock{material=SCULK} @SelfLocation{x=0;y=-1;z=1}
  - setblock{material=SCULK} @SelfLocation{x=0;y=-1;z=-1}
  - setblock{material=SCULK} @SelfLocation{x=1;y=-1;z=1}
  - setblock{material=SCULK} @SelfLocation{x=-1;y=-1;z=1}
  - setblock{material=SCULK} @SelfLocation{x=1;y=-1;z=-1}
  - setblock{material=SCULK} @SelfLocation{x=-1;y=-1;z=-1}
  - setblock{material=SCULK} @SelfLocation{x=2;y=-1}
  - setblock{material=SCULK} @SelfLocation{x=-2;y=-1}
  - setblock{material=SCULK} @SelfLocation{x=0;y=-1;z=2}
  - setblock{material=SCULK} @SelfLocation{x=0;y=-1;z=-2}
  - setblock{material=SCULK_CATALYST} @SelfLocation
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{x=1}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{x=-1}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{z=1}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{z=-1}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{x=2}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{x=-2}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{z=2}
  - setblock{material=SCULK_VEIN[down=true]} @SelfLocation{z=-2}

SculkCreeperDetonate:
  Cooldown: 8
  Conditions:
  - targetwithin{d=3.5} true
  Skills:
  - state{s=swell;li=0;lo=0} @self
  - effect:sound{s=entity.creeper.primed;v=1;p=0.7} @self
  - delay 25
  - skill{s=SculkCreeperSpread} @self
  - effect:explosion{yield=2.5;fire=false} @self
  - remove @self
