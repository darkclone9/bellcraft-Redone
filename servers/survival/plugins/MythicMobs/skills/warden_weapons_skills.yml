WardenWandOnHit:
  Cooldown: 0.4
  Skills:
  - effect:particles{p=sculk_soul;amount=14;hS=0.35;vS=0.35;speed=0.04} @targetlocation
  - effect:particles{p=sculk_charge_pop;amount=8;hS=0.25;vS=0.25;speed=0.02} @targetlocation
  - effect:sound{s=block.sculk_sensor.clicking;v=0.7;p=1.3} @self
  - damage{a=2;pi=true} @target

WardenWandHitChance:
  Cooldown: 0.2
