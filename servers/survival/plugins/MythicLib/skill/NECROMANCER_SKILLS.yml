# Necromancer class skills.
#
# Builtin MythicLib handlers, with a triggers block, so the class can be
# selected and bound. source: mythicmobs:... does not resolve here (MythicMobs
# loads after MythicLib), so these stay on default: handlers.
#
# MythicMobs casts and pets already live in:
#   MythicMobs/skills/necromancer_cast_skills.yml
#   MythicMobs/mobs/necromancer_pets.yml
# Do not rename the unlock ids below.
#
#   NECROMANCER_RAISE_DEAD       NecromancerRaiseDead_Cast
#   NECROMANCER_SOUL_DRAIN       NecromancerSoulDrain_Cast
#   NECROMANCER_RAISE_ELITE      NecromancerRaiseElite_Cast      pet NecroReaperElite (cap 1)
#   NECROMANCER_LIFE_SIPHON      NecromancerLifeSiphon_Cast
#   NECROMANCER_DEATH_GRASP      NecromancerDeathGrasp_Cast
#   NECROMANCER_RAISE_MINION     NecromancerRaiseMinion_Cast     pets NecroMinionSkulker / NecroMinionWretch (cap 4)
#   NECROMANCER_UNHOLY_COMMAND   NecromancerUnholyCommand_Cast
#   NECROMANCER_CORPSE_EXPLOSION NecromancerCorpseExplosion_Cast
#
# Raises are corpse-sourced only. These builtins do not summon a free pet.

NECROMANCER_RAISE_DEAD:
  name: "&5Raise Dead"
  icon: SKELETON_SKULL
  source: default:WITHER
  parameters:
    cooldown:
      player:
        base: 12
        per-level: -0.08
        min: 6
        max: 12
      name: Cooldown
    mana:
      player:
        base: 14
        per-level: 0.22
      name: Mana
    duration:
      player:
        base: 4.0
        per-level: 0.06
      name: Duration
  triggers:
    cast:
    - potion{type=WITHER;duration={duration};amplifier=0}
    - particle{p=SOUL;amount=80;speed=0.4;hS=1.5;vS=1.2}
    - particle{p=SOUL_FIRE_FLAME;amount=30;speed=0.2;hS=1;vS=1}
    - sound{s=ENTITY_WITHER_AMBIENT;v=1.2;p=0.7}

