# --- Player corpse drops (required for player kills; pets already ~onKill) ---
# Trigger name varies by MythicLib version: KILL_ENTITY / KILL / ON_KILL.
# Confirm against your MythicLib trigger list before enabling.
NECROMANCER_CORPSE_MARK:
  name: "&8Grave Mark"
  icon: BONE
  source: mythicmobs:NecromancerDropCorpse_Cast
  # trigger: KILL_ENTITY
  parameters:
    cooldown:
      player:
        base: 0
        per-level: 0
      name: Cooldown
    mana:
      player:
        base: 0
        per-level: 0
      name: Mana
