# MythicLib bridge notes for Necromancer (Bellcraft-Classes PR #51).
# The selectable class and its builtin skills now live in:
#   MMOCore/classes/necromancer.yml
#   MythicLib/skill/NECROMANCER_SKILLS.yml
# Leave those skills on source: default:<HANDLER>. source: mythicmobs:<CastId>
# does not resolve on this server (MythicMobs loads after MythicLib).
# The casts below are the MythicMobs side, already in
# MythicMobs/skills/necromancer_cast_skills.yml. Do not paste them over the
# builtin skill file.
#
# Class unlock IDs stay exactly:
#   NECROMANCER_RAISE_DEAD, NECROMANCER_SOUL_DRAIN, NECROMANCER_RAISE_ELITE,
#   NECROMANCER_LIFE_SIPHON, NECROMANCER_DEATH_GRASP, NECROMANCER_RAISE_MINION,
#   NECROMANCER_UNHOLY_COMMAND, NECROMANCER_CORPSE_EXPLOSION

