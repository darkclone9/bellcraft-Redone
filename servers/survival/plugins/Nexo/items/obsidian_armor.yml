# Bellcraft Obsidian Heavy Armor — Nexo items
# Namespace: astra (matches house pack / warden weapons / sculk_sentinel)
# Give: /nexo give <player> obsidian_helmet|obsidian_chestplate|obsidian_leggings|obsidian_boots
#
# Worn look: chest/legs/boots use Components.equippable.asset_id → astra:obsidian_armor
#   equipment JSON + humanoid / humanoid_leggings textures (NOT vanilla netherite layers).
# Helmet: equippable HEAD + item_model (3D greathelm). Stats unchanged.
#
# Attribute baseline (Nexo). MMOItems MOVEMENT_SPEED may be layered later by BUG BOt.
#   each piece: MOVEMENT_SPEED -0.005 (add) — full set ≈ -0.02 (~20% slow)
#   helmet:     ARMOR_TOUGHNESS +2.0
#   chestplate: MAX_HEALTH +4.0 (2 hearts)
#   leggings:   KNOCKBACK_RESISTANCE +0.15
#   boots:      ARMOR +3.0

obsidian_helmet:
  itemname: "<gradient:#1a0f24:#5a2d8a:#c78bff>Obsidian Helmet</gradient>"
  material: NETHERITE_HELMET
  lore:
    - "<#6f737d>» <#D5D6D8>Polished charcoal greathelm"
    - "<#6f737d>» <#c78bff>Toughness boost"
    - "<#6f737d>» <#5a2d8a>Heavy · Slows wearer · Armor Toughness"
  unbreakable: true
  disable_enchanting: true
  ItemFlags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
    - HIDE_ENCHANTS
  AttributeModifiers:
    - attribute: ARMOR_TOUGHNESS
      amount: 2.0
      operation: 0
      slot: HEAD
    - attribute: MOVEMENT_SPEED
      amount: -0.005
      operation: 0
      slot: HEAD
  Pack:
    generate_model: false
    model: astra:item/obsidian_helmet
    texture: astra:item/obsidian_helmet
  Components:
    equippable:
      slot: HEAD
    item_model: astra:obsidian_helmet
    enchantable: 0
  PersistentData:
    - type: STRING
      key: bellcraft:obsidian_armor
      value: "helmet"

