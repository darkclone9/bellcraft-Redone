# BetterRTP Locations configuration
# Formatted for Bellcraft Wilderness Zones

Enabled: true # enable the locations feature
RequirePermission: false # Require players to have `betterrtp.location.<location_name>`
UseLocationIfAvailable: false # Will NOT randomly pick a location upon plain `/rtp`
UseLocationsInSameWorld: true # Only choose locations in same world rtp'ing in

Locations:
- zone1:
    World: world
    CenterX: 0
    CenterZ: 0
    MaxRadius: 1000
    MinRadius: 600
    Shape: circle
    MinY: 0
    MaxY: 320
    Biomes:
    - plains
    - sunflower_plains
    - meadow
    - forest
    - flower_forest
    - birch_forest
    - cherry_grove
    - river
    - beach
