mmoitems_example:
  # Permission need to open this shop
  permission: ''
  # Enable or Cancels the use of bottom inventory.
  bottom_inventory: true
  # GUI display name
  name: '[{category}] <white> CoreShop'
  # How many rows will Inventory have.
  # Must be between 1 and 6
  size: 6
  fill_material: 'AIR' # Fill material for bottom inventory
  default_category: Sword
  default_animation: 'default' # default

  # Most of the time, players don't want to sell items from their hotbar.
  # You can skip these slots when automatically selling items to the shop.
  ignore_hotbar_slots: false

  messages:
    insufficient-money: '<bold><red>CoreShop ✖<reset> You don''t have {total_cost}{currency_symbol} to cover this.'
    not-allowed-to-sell: '<bold><red>CoreShop ✖<reset> This item is not allowed to be sold.'
    not-allowed-to-buy: '<bold><red>CoreShop ✖<reset> This item is not allowed to be purchase.'
    successful-sell: '<bold><green>CoreShop ✔<reset> You have successfully purchased <bold><yellow>{amount}x {item_name}<reset> for {total_cost}{currency_symbol}.'
    successful-buy: '<bold><green>CoreShop ✔<reset> You have successfully sold <bold><yellow>{amount} x {item_name}<reset> for {total_cost}{currency_symbol}.'
    not-enough-item: '<bold><red>CoreShop ✖<reset> You don''t have the required {amount} of {item_name}<reset> to make the sale.'
    not-enough-item-buy-all: '<bold><red>CoreShop ✖<reset> You don''t have the {item_name}<reset> to make the sale.'
    no-space-inventory: '<bold><red>CoreShop ✖<reset> You don''t have enough empty space in your inventory.'
    no-space-playervault: '<bold><red>CoreShop ✖<reset> You don''t have enough empty space in your PlayerVault.'
    no-permission: '<bold><red>CoreShop ✖<reset> You do not have permission to open this shop.'

  sound:
    no_permission: [minecraft:entity.villager.no,master,1,2]
    insufficient_money: [minecraft:entity.villager.no,master,1,2]
    not_allowed_to_sell: [minecraft:entity.villager.no,master,1,2]
    not_allowed_to_buy: [minecraft:entity.villager.no,master,1,2]
    not_enough_item: [minecraft:entity.villager.no,master,1,2]
    not_enough_item_buy_all: [minecraft:entity.villager.no,master,1,2]
    no_space_inventory: [minecraft:entity.villager.no,master,1,2]
    no_space_playervault: [minecraft:entity.villager.no,master,1,2]
    successful_sell: [minecraft:entity.player.levelup,master,1,2]
    successful_buy: [minecraft:entity.player.levelup,master,1,2]

  # The settings for how the placeholders "{sorting_default}", "{sorting_money_descending}",
  # and "{sorting_money_ascending}" will be parsed. The section before the comma is for when
  # they are inactive, while the section after the comma is for when they are active.
  sorting:
    default: [<white>▷ Default,<green><bold>▶ Default]
    money_descending: [<white>▷ Price Descending,<green><bold>▶ Price Descending]
    money_ascending: [<white>▷ Price Ascending,<green><bold>▶ Price Ascending]

  # When a player purchases an item,
  # how will it be delivered?
  #
  # mode 1: Player inventory only
  # mode 2: PlayerVault only.
  # mode 3: Player inventory if full PlayerVault.
  delivery:
    mode: 3
    playervault: myfirstvault

  # In this section, you can configure the actions that
  # occur when items for sale are clicked.
  #
  # The 'quick_*' options will immediately perform the transaction
  # using the first buy or sell option written on the item.
  #
  # 'advanced' opens a more advanced purchase GUI for the player.

  items_click:
    left_click: advanced
    right_click: ''
    swap_hand: buy_all
    shift_left_click: quick_sell
    shift_right_click: quick_buy

  # Amount for quick buy and sell
  amount:
    quick_sell: 1
    quick_buy: 1

  # The bottom display/item lore is a fixed lore that will be added to
  # the bottom of the lores of items displayed in the inventory
  # or the item given to player. If an item has its own bottom**
  # lore settings, it will override this option.
  bottom_display_lore:
    - '<white>﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏'
    - '<white>■ Left click to Advanced Purchase'
    - '<white>■ Shift Left click to Quick Buy : {money_sell_vault}'
    - '<white>■ Shift Right click to Quick Sell : {money_buy_vault}'
    - '<white>﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋﹋'
  # This is added to the bottom of the lore of the sold item.
  bottom_item_lore:
    - ''
    - '<white>Purchased from CoreShops❤'

  advanced:
    name: 'Purchase || {item_name}'
