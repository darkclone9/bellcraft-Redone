  discord:
    # Go to the settings of the channel where you want the messages to be displayed,
    # and under the Integrations tab, create a webhook URL and enter it in this section.
    # If you want to completely disable Discord messages, set the webhookurl to ''
    webhookurl: ''

    # Since color codes and Unicode characters are often used in item names and lores,
    # they need to be cleaned before being sent to Discord. With the default regex setting,
    # everything except a-z, A-Z, 0-9, space, and the ■ character is removed. You can customize
    # this setting as you wish, and you can test your regex live on regex101.com.
    regex: "[^a-zA-Z0-9/■\\s]"
    #    regex: "[^a-zA-Z0-9/■\\s\u3040-\u30FF\u4E00-\u9FFF\u3400-\u4DBF\uF900-\uFAFF]" # English and Japanese characters also attached

    # You might not want certain lines within the lore because they look very bad on your Discord server.
    # If any line contains the exact string you put inside the "Contain" list anywhere within it,
    # that line will be removed before being sent to the Discord server.
    contain:
      - 'Right Click'
      - '§a◆ Empty'
      - '§f §8§l|§7'
      - '§7Amplifier'

    # Events for which messages will be sent. If you want to disable any of them,
    # simply set it to an empty string ''. Empty messages will not be sent.
    item-listed: |
      {
        "username": "CoreTools AuctionHouse",
        "content": "📌",
        "embeds": [
          {
            "title": "⏬ New item added to [{ah_id}]",
            "avatar_url": "",
            "description": "**{seller_name}** added new item from **{seller_region}** region",
            "color": 65280,
            "fields": [
              {
                "name": "Item:",
                "value": "{item_name}\n{item_lore}",
                "inline": true
              },
              {
                "name": "Item info",
                "value": "**Source:** {plugin_source}\n**Id**: {plugin_id}\n**Tier**: {plugin_tier}\n**Type**: {plugin_type}\n**Material**: {item_material}",
                "inline": true
              },
              {
                "name": "AH Info",
                "value": "Currency: {currency}\nUnit Price: {unit_price}\nUnit Tax: {unit_tax}\nAmount: {amount}x\nTotal: {currency_symbol}{total}\nAfter Tax: {currency_symbol}{total_after_tax}",
                "inline": true
              }
            ],
            "footer": {
              "text": "Coretools Discord WebHook"
            },
            "timestamp": "%timestamp%"
          }
        ]
      } 

    item-purchased: |
      {
        "username": "CoreTools AuctionHouse",
        "content": "📌",
        "embeds": [
          {
            "title": "⏫ {item_name} {amount}x purchased from [{ah_id}]",
            "avatar_url": "",
            "description": "**{buyer_name}** purchased item from **{buyer_name}** in **{buyer_region}** region",
            "color": 65280,
            "fields": [
              {
                "name": "Item:",
                "value": "{item_name}\n{item_lore}",
                "inline": true
              },
              {
                "name": "Item info",
                "value": "**Source:** {plugin_source}\n**Id**: {plugin_id}\n**Tier**: {plugin_tier}\n**Type**: {plugin_type}\n**Material**: {item_material}\n**Seller**: {seller_name}",
                "inline": true
              },
              {
                "name": "AH Info",
                "value": "Currency: {currency}\nUnit Price: {unit_price}\nUnit Tax: {unit_tax}\nAmount: {amount}x\nTotal: {currency_symbol}{total}\nAfter Tax: {currency_symbol}{total_after_tax} {seller_name} {item_name} is expired.",
                "inline": true
              }
            ],
            "footer": {
              "text": "Coretools Discord WebHook"
            },
            "timestamp": "%timestamp%"
          }
        ]
      } 

    item-expired: '{"content":"{seller_name}''s {item_name} item from {ah_id}-[{item_id}] is expired."}'
    item-expired-taken: '{"content":"**{seller_name}** take the expired **{item_name}** item from {ah_id}-[{item_id}]."}'
    bid-place: ''
    player-cancel-item: '{"content":"**{seller_name}** cancel the **{item_name}** item from {ah_id}-[{item_id}]."}'
    player-take-expired-item: ''
    player-take-won-item: ''

  # The settings for how the placeholders "{sorting_default}", "{sorting_money_descending}",
  # and "{sorting_money_ascending}" will be parsed. The section before the comma is for when
  # they are inactive, while the section after the comma is for when they are active.
  sorting:
    default_ascending: [ <white>▷ Default △,<green><bold>▶ Default ▲ ]
    default_descending: [ <white>▷ Default ▽,<green><bold>▶ Default ▼ ]
    expire_ascending: [ <white>▷ Expire Date △,<green><bold>▶ Expire Date ▲ ]
    expire_descending: [ <white>▷ Expire Date ▽,<green><bold>▶ Expire Date ▼ ]
    price_ascending: [ <white>▷ Price △,<green><bold>▶ Price ▲ ]
    price_descending: [ <white>▷ Price ▽,<green><bold>▶ Price ▼ ]

    # You can add any numeric or string-based MMOItem stats to the custom sorting system.
    # mmoitem:<stat><_ascending/_descending>
    mmoitem:attack_damage_ascending: [ <white>▷ Damage △,<green><bold>▶ Damage ▲ ]
    mmoitem:attack_damage_descending: [ <white>▷ Damage ▽,<green><bold>▶ Damage ▼ ]
    mmoitem:tier_ascending: [ <white>▷ Tier △,<green><bold>▶ Tier ▲ ]
    mmoitem:tier_descending: [ <white>▷ Tier ▽,<green><bold>▶ Tier ▼ ]

  # Allows you to use any numeric or string-based stats from MMOItems items in sorting.
  # Add all the stats you want to use for sorting to the stats list using the format: mmoitem:<stat>
  # For string-based sorting, you must define the priority manually in
  # order of importance under the priority section, like in the example below.
  sorting_custom:
    stats: [mmoitem:attack_damage,mmoitem:tier]
    priority:
      # Based on the list you provide, each item will be numbered from left to right as 1, 2, 3, 4, and so on.
      # If the item doesn’t have the specified stat, its value will be considered as 0.
      mmoitem:tier: [TRASH,COMMON,UNCOMMON,RARE,EPIC,LEGENDARY,UNIQUE]

  # Which method should be used to deliver the items to players?
  #
  # Mode 1: Attempts to add the item to the player's inventory.
  # Mode 2: Attempts to add the item to the player's PlayerVault.
  # Mode 3: Attempts to add the item to the player's inventory.
  #         If unsuccessful, it tries to add it to the PlayerVault.
  # Mode 4: Attempts to add the item to the player's inventory.
  #         If it fails, it tries to add it to the player's PlayerVault.
  #         If that also fails, the item will be dropped at the player's location.
  # Mode 5: Item will be dropped at the player's location.
  #
  delivery:
    # `deliver_offline_items_on_join` attempts to deliver items that expired or were won via bidding while the player was offline,
    # using the configured delivery mode when the player rejoins the server.
    # All money from items sold while the player is offline is automatically delivered to the player without requiring any configuration.
    deliver_offline_items_on_join: false
    purchase_mode: 3
    playervault: [ myfirstvault,account ]

  # You can configure what happens after certain internal events below.
  #
  # 'close' The GUI will be closed
  # 'nothing' No action will be taken after the event
  # 'category' Returns to the last category.
  event_actions:
    purchase_successful: category
    purchase_failed: close
    sell_successful: category

  # The display lore is a fixed lore that will be added to
  # the bottom of the lores of items displayed in the inventory
  display_lore:
    - ''
    - '<bold><yellow>Purchase Type: Fixed Price'
    - '<white><bold>Seller:</bold> {seller}'
    - '<white><bold>Item Id:</bold> {item_id}'
    - '<white><bold>Price:</bold> {price}{currency_symbol}'
    - '<white><bold>Time Left:</bold> {days} days {hours} hours {minutes} minutes'
    - ''
    - '<red><bold>➤ Click to buy instantly!'

  display_lore_bid:
    - ''
    - '<bold><yellow>Purchase Type: Auction'
    - '<white><bold>Seller:</bold> {seller}'
    - '<white><bold>Item Id:</bold> {item_id}'
    - '<white><bold>Last Bidder:</bold> {bidder}'
    - '<white><bold>Current Bid: {price}{currency_symbol}'
    - '<white><bold>Time Left:</bold> {days} days {hours} hours {minutes} minutes'
    - ''
    - '<red><bold>➤ Click to place a bid!'

