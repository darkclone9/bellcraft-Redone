  # Category filtering is one of the most critical components.
  # You configure all the items that can be listed for sale in this section.
  # Based on the settings you make here, all your items will automatically be sorted into categories.
  categories:
    all:
      name: 'All Items'

    sword:
      # If you want to use the default_minimum_bid_increment, you can set it to -1.
      # If it's not set to -1, the value you define here will be used as the
      # minimum increment for all auction items in this category.
      minimum_bid_increment: 100
      advanced_minimum_bid_increment:
        vault: 10
        coins: 20
        playerpoints: 30
      name: 'Sword [{page_no}]'
      restriction_advanced:
        allow:
