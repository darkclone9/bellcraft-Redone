mmoitems_example:
  # Permission need to open this shop
  permission: ''
  # Multi-server support is provided via Redis/Valkey.
  # To enable it, set the value below to "redis" and configure the Redis settings in config.yml.
  # ---
  # !!! WARNING: IF YOU'RE ENABLING MULTI-SERVER SUPPORT !!!
  # Make sure that all of your AuctionHouses
  # with the same ID in all servers are set to redis.
  # ---
  multi_server: single
  # Enable or Cancels the use of bottom inventory.
  bottom_inventory: true
  fill_material: 'AIR' # Fill material for bottom inventory
  # GUI display name
  name: '[{category}] <white>AuctionHouse'
  # How many rows will Inventory have.
  # Must be between 1 and 6
  size: 6
  default_category: all
  default_regions: [ city1,city2,city3 ] # Do not use underscores `_` in region names.
  #The default bid increment that will be used for all bids set to -1 in the category settings.
  default_minimum_bid_increment: 50
  # You can configure which sell mode will be selected by default when an item is listed for sale.
  # If you want to disable fixed-price or bid selling, you can remove them from the GUI settings and set the default sell mode here.
  # If you want to offer your players multiple options and force them to make a selection, leave it as ''.
  default_sales_mode: '' #fixed bid
  # If you don't want to offer your players multi-currency support,
  # you can set the default currency here and remove the buttons from the GUI.
  # Leave '' if you want to offer your players multiple options and force them to make a selection.
  default_currency: ''
  # If you want to require the player to manually select the duration in days, leave this setting at 0.
  default_days: 0
  # The maximum number of active items players can list.
  # If the player does not have any of the listed permissions, the default is used.
  player_max_item:
    default: 10
    player: 20
    vip: 30
    vip_plus: 40

  # This disables partial purchases for items with multiple quantities, forcing players to purchase the entire stack.
  disable_partial_purchase: false

  # This script runs before parsing the buttons or title
  # placeholders when the menu is opened. If you're
  # using a dynamic variable, you can set it according to the player.
  # Or you can even add music to the opening!
  # Only runs when the AuctionHouse is first opened.
  start_script:
    - menu_opening

  # Only runs when the AuctionHouse is completely closed.
  close_script:
    - beep

  player_input:
    signgui:
      material: 'OAK_WALL_SIGN' # Available sign types: OAK_SIGN, BIRCH_SIGN, SPRUCE_SIGN, JUNGLE_SIGN, ACACIA_SIGN, DARK_OAK_SIGN, CRIMSON_SIGN, WARPED_SIGN, CHERRY_SIGN, MANGROVE_SIGN, BAMBOO_SIGN, PALE_OAK_SIGN, OAK_WALL_SIGN, BIRCH_WALL_SIGN, SPRUCE_WALL_SIGN, JUNGLE_WALL_SIGN, ACACIA_WALL_SIGN, DARK_OAK_WALL_SIGN, CRIMSON_WALL_SIGN, WARPED_WALL_SIGN, CHERRY_WALL_SIGN, MANGROVE_WALL_SIGN, BAMBOO_WALL_SIGN, PALE_OAK_WALL_SIG`
      dye_color: 'BLACK' # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/DyeColor.html
      line1: ''
      line2: 'Enter the amount'
      line3: 'you want and then'
      line4: 'press Done'
      # Which input line will be accepted as user input? Set the line you want to accept from the user as ''
      input_line: 1
      # How many times should a player be allowed to enter the required data incorrectly,
      # or press Esc, before the sign UI stops reopening and returns to the sell GUI?
      max_try: 3
      # This regex only allow numbers and only one dot. If you want to allow only numbers without dot use "\\d+"
      regex: "\\d+(\\.\\d+)?"
    anvilgui:
      title: 'Enter the amount'
      text: '0'
      # Which item slots should be used as the confirm buttons? 0 = Left item, 1 = Right item, 3 = Result item
      slots: [ 0,1,2 ]
      left_item:
        source: vanilla
        name: 'Left Item %'
        material: dirt
        flags: [ HIDE_ATTRIBUTES ]
      right_item:
        source: vanilla
        name: 'Right Item'
        material: stone
        flags: [ HIDE_ATTRIBUTES ]
      result_item:
        source: vanilla
        name: 'Confirm'
        material: wooden_sword
        flags: [ HIDE_ATTRIBUTES ]
      # How many times should a player be allowed to enter the required data incorrectly,
      # or press Esc, before the sign UI stops reopening and returns to the sell GUI?
      max_try: 3
      # This regex only allow numbers and only one dot. If you want to allow only numbers without dot use "\\d+"
      regex: "\\d+(\\.\\d+)?"

  messages:
    item-listed: '<bold><green>AuctionHouse ✔<reset> You have successfully listed; {amount}x <gold>''{item_name}''<reset> for {unit_price}{currency_symbol} per unit.'
    item-listed-bid: '<bold><green>AuctionHouse ✔<reset> You have successfully listed; {amount}x <gold>''{item_name}''<reset> for {unit_price}{currency_symbol}.'
    item-listed-not-enough-money: '<bold><red>AuctionHouse ✖<reset> You don''t have the required {total}{currency_symbol} to list this item.'
    item-listed-max-limit: '<bold><red>AuctionHouse ✖<reset> You cannot list another item because you have reached the maximum number of items you can list.'
    item-purchased-online-seller: '<bold><green>AuctionHouse ✔<reset> Your item has been sold: {amount}x <gold>''{item_name}''<reset> for {total}{currency_symbol} After tax: {total_after_tax}{currency_symbol}.'
    item-purchased-online-buyer: '<bold><green>AuctionHouse ✔<reset> You have successfully purchased; {amount}x <gold>''{item_name}''<reset> for {total}{currency_symbol}.'
    item-won-offline-buyer: '<bold><green>AuctionHouse ✔<reset><gold> Congratulations, you won the auction!<reset> Please claim your item from AuctionHouse.'
    item-won-buyer-online: '<bold><green>AuctionHouse ✔<reset><gold> Congratulations, you won the auction!<reset> Please claim your <gold>''{item_name}''<reset> from AuctionHouse.'
    expired-bid-item-success-online-seller: '<bold><green>AuctionHouse ✔<reset> Your auction for {amount}x <gold>''{item_name}''<reset> has ended and the item was successfully sold for {total}{currency_symbol} After tax: {total_after_tax}{currency_symbol}.'
    expired-bid-item-fail-online-seller: '<bold><red>AuctionHouse ⏳<reset> Your auction for {amount}x <gold>''{item_name}''<reset> has ended without receiving any bids.'
    expired-fixed-item-online-seller: '<bold><red>AuctionHouse ⏳<reset> The listing period for your fixed-price item {amount}x <gold>''{item_name}''<reset> has ended. Please claim them before they are permanently deleted.'
    expired-fixed-item-offline-seller: '<bold><red>AuctionHouse ⏳<reset> There are expired items still available. Please claim them before they are permanently deleted.'
    already-sold: '<bold><red>AuctionHouse ✖<reset> This item has been purchased by someone else.'
    expired: '<bold><red>AuctionHouse ✖<reset> This item has been removed from sale because its listing period has expired.'
    cancelled: '<bold><red>AuctionHouse ✖<reset> This item has been removed from sale by the seller.'
    not-enough-amount: '<bold><red>AuctionHouse ✖<reset> There is no longer a sufficient amount of the item you''re trying to purchase.'
    not-enough-money: '<bold><red>AuctionHouse ✖<reset> You don''t have the required {total}{currency_symbol} to purchase this item.'
    money-player-join: '<bold><green>AuctionHouse ✔<reset> Some of your items were sold while you were offline for {total}{currency_symbol}.'
    collect-money-from-tax-system: '<bold><green>AuctionHouse ✔<reset> You have successfully collected the {total}{currency_symbol} accumulated in the AuctionHouse.'
    bid-cancel-new-bid: '<bold><green>AuctionHouse ✔<reset> Your bid was canceled because another player placed a bid before you.'
    bid-place: '<bold><green>AuctionHouse ✔<reset> You have successfully bid; {amount}x ''{item_name}''<reset> for {unit_price}{currency_symbol} per unit.'
    player-cancel-item: '<bold><green>AuctionHouse ✔<reset> You have successfully cancel listing; {amount}x <gold>''{item_name}''.'
    player-take-expired-item: '' #<bold><green>AuctionHouse ✔<reset> You have successfully take the {amount}x ''{item_name}''.
    player-take-won-item: '' #<bold><green>AuctionHouse ✔<reset> You have successfully take the {amount}x ''{item_name}''.
    delivery-successful-inventory: '<bold><green>AuctionHouse ✔<reset> The {amount}x <gold>''{item_name}''<reset> has been successfully sent to your inventory.'
    delivery-successful-playervault: '<bold><green>AuctionHouse ✔<reset> The {amount}x <gold>''{item_name}''<reset> has been successfully sent to your PlayerVault.'
    delivery-fail-inventory: '<bold><red>AuctionHouse ✖<reset> You don''t have any free space in your inventory.'
    delivery-fail-playervault: '<bold><red>AuctionHouse ✖<reset> You don''t have any free space in your PlayerVault.'
