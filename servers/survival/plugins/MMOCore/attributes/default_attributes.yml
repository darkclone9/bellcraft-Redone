
# Attribute ID
strength:

    name: Strength
    
    # Maximum amount of points players 
    # may spend in this attribute.
    max-points: 100
    
    # Buffs given every 1 attribute point spent
    # in this specific attribute.
    #
    # Strength is a physical combat attribute that improves
    # melee damage, critical strikes, sustain via saturation,
    # and natural health regeneration (Healing Factor).
    # Max health boost has been removed for balance.
    buff:
        attack_damage: 0.1
        critical_strike_chance: '0.25%'
        max_health: 0.15
        health_regeneration: 0.04

dexterity:
    name: Dexterity
    max-points: 100
    buff:
        physical_damage: 0.8
        projectile_damage: 0.8
        attack_speed: '0.2%'
        movement_speed: '0.1%'

intelligence:
    name: Intelligence
    max-points: 100
    buff:
        max_mana: 1
        magic_damage: 0.7
        cooldown_reduction: 0.15

wisdom:
    name: Wisdom
    max-points: 100
    buff:
        health_regeneration: 0.04
        max_mana: 0.8%            # +0.8% max mana per point
        mana_regeneration: 0.15
