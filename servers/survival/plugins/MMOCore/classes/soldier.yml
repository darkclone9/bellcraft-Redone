  TACTICAL_RELOAD:
    level: 1
    max-level: 30
    unlocked-by-default: false

  # ---- Specialisation skills (generated) ----
  BULWARK_RETALIATION:
    level: 1
    max-level: 20
    unlocked-by-default: false
  BULWARK_LAST_STAND:
    level: 1
    max-level: 20
    unlocked-by-default: false
  BREACHER_MOMENTUM:
    level: 1
    max-level: 20
    unlocked-by-default: false
  BREACHER_EXECUTE:
    level: 1
    max-level: 20
    unlocked-by-default: false

skill-trees:
  - 'soldier'
  - 'profession-mining'
  - 'profession-woodcutting'
  - 'profession-farming'
  - 'profession-fishing'
  - 'profession-alchemy'
  - 'profession-smithing'
  - 'profession-enchanting'
  - 'profession-smelting'

triggers:
  level-up-multiple-4:
    - 'command{format="bellcraft-grant-ap %player_name%"}'
    - 'command{format="bellcraft-grant-sp %player_name%"}'
    - 'command{format="bellcraft-grant-stp %player% soldier"}'
