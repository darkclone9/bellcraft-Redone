    - '&7Strikes fast and is gone before they turn.'
    - ''
    - '&7Specialisations:'
    - '&2- Venom &8: poison everything, let it bleed out'
    - '&8- Shadow &8: one hit from nowhere, then vanish'
  item: IRON_SWORD
  slot: 12

