display:
  name: 'Sorcerer'
  lore:
    - '&eClass Role: Caster DPS / Elementalist'
    - '&7An innate spellcaster who channels'
    - '&7raw elemental arcana to unleash'
    - '&7devastating magical destruction.'
  item: BLAZE_ROD
  slot: 22

mana:
  char: "☄"
  icon: "&c☄"
  name: 'Arcana'
  color:
    full: RED
    half: DARK_RED
    empty: DARK_GRAY

stats:
  # Rebalanced 2026-09-10 on a shared budget: every class carries one primary damage
  # stat and lands within ~8% of the others at base and ~7% per level. Every class also
  # carries MANA_REGENERATION; without it a class with no Wisdom could cast three times
  # and then wait three minutes.
  # Highest MAGIC_DAMAGE in the game. No SKILL_DAMAGE, so it does not stack two
  # damage stats on the same spells.
  MAX_HEALTH:
    base: 19
    per-level: 1.9
  MAX_MANA:
    base: 56
    per-level: 6.2
  MAGIC_DAMAGE:
    base: 7
    per-level: 2.1
  ARMOR:
    base: 2
    per-level: 0.2
  MANA_REGENERATION:
    base: 2.5
    per-level: 0.6
  MOVEMENT_SPEED:
    base: 0.108
    per-level: 0.0

attributes:
  # Fixed budget for every class: 20 points at base, 4.0 per level.
  dexterity:
    base: 2
    per-level: 0.4
  intelligence:
    base: 16
    per-level: 3.2
  wisdom:
    base: 2
    per-level: 0.4

options:
  default: false
  display: true
  needs-permission: false
  off-combat-health-regen: false
  off-combat-mana-regen: true

