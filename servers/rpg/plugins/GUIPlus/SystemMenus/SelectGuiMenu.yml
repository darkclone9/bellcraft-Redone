# Menu shown when a click event needs a GUI to be picked,
# e.g. the "Open another GUI" click event.

# Something else to note would be, never change the ids for default items! or else you will break the GUIs
title: Select a GUI
rows: 6

empty-fill:
  enabled: true
  slots:
    - all
  item:
    name: '&r'
    lore: [ ]
    type: BLUE_STAINED_GLASS_PANE
    amount: 1
    item-flags:
      - "all"
    unbreakable: false
    enchantments: [ ]
    custom-model-data: 0

selectable-guis:
  enabled: true
  slots:
    - 10-16
    - 19-25
    - 28-34
    - 37-43
  item:
    name: '&f&l%gui_name%'
    lore:
      - '&7Title: &f%gui_title%'
      - '&7Type: &f%gui_type%'
      - '&7Command alias: &f%gui_alias%'
      - ''
      - '&eClick to select this GUI.'
    type: CHEST
    amount: 1
    unbreakable: false
    item-flags:
      - "all"
    enchantments: [ ]
    custom-model-data: 0

  no-gui-found-item:
    name: '&cNo GUIs Found'
    slot: 22
    lore:
      - '&7There are currently no GUIs available'
      - '&7to link to. Create one first!'
    type: RED_STAINED_GLASS_PANE
    amount: 1
    unbreakable: false
    item-flags:
      - "all"
    enchantments: [ ]
    custom-model-data: 0

