# Zone elite drops. These mobs are a few percent of natural spawns, but each table used to
# hand out stacks of 2-6 junk (string, sticks, sand, bones) on most kills, so a common fight
# dropped four or more useless items. Amounts are 1, and the junk lines are uncommon.
# The exp line is experience orbs, not an item. Rare prizes (nautilus, blue ice, netherite
# scrap) stay rare.
bramble_stalker_drops:
  Drops:
    - 'oak_sapling 1 0.2'
    - 'string 1 0.15'
    - 'exp 8-16 1'
