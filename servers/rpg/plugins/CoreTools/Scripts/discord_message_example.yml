discordmessage:
  Conditions: []
  Mechanics:
    - discordmessage{
      webhookurl=<<REDACTED>>
      message="example1"}
    - discordmessage{
      webhookurl=<<REDACTED>>
      message="example2"}
    - discordmessage{
      webhookurl=<<REDACTED>>
      message="discohookapp"}
  Extra:
    example1: |
      {
        "username": "CoreTools Mechanic",
        "content": "📌",
        "embeds": [
          {
            "title": "⏬ Hello {caster_name}",
            "description": "**Description Message!**",
            "color": 65280,
            "fields": [
              {
                "name": "name1",
                "value": "value1",
                "inline": true
              },
              {
                "name": "name2",
                "value": "value2",
                "inline": true
              },
              {
                "name": "name3",
                "value": "value3",
                "inline": false
              }
            ],
            "footer": {
              "text": "Coretools WebHook"
            },
            "timestamp": "%timestamp%"
          }
        ]
      }

    example2: '{"username": "CoreTools Mechanic","content":"**Plain Text Example**"}'

    discohookapp: |
      {
        "content": "Hey, welcome to <:discohook:736648398081622016> **Discohook**! The easiest way to personalize your Discord server.\n\nThere's more info below if you want to read it. When you're ready, press **Clear All** at the top of the editor to delete what's written here.\n\n_ _",
        "embeds": [
          {
            "title": "What is this?",
            "description": "At its core, Discohook is a simple message designer. You can use it to send fully customizable messages to your Discord server with the use of [webhooks](https://support.discord.com/hc/en-us/articles/228383668).",
            "color": 5814783,
            "fields": [
              {
                "name": "Discohook Utils - complementary bot",
                "value": "You can [invite our bot here](https://discohook.app/bot). In case you recognize that name, Discohook [merged with Discohook Utils](https://discohook.app/guide/deprecated/migrate-utils) in 2024. If you have Discobot in your server, invite Discohook Utils instead for all future use."
              }
            ]
          }
        ]
      }
