# "build" on the builders' plot server; "live" where finished builds are imported from.
# This server's overworld is a one-time snapshot of survival (ops/bellcraft-creative-world),
# so it must stay "live". role "build" generates the plot grid and would overwrite that copy.
role: live

# Velocity names of the other servers.
build-server: build
lobby-server: lobby

# Every server reads and writes the team's shared data (plots, submissions and the
# schematics themselves) here, so a build saved on the build server can be loaded anywhere.
shared-dir: /opt/bellcraft/data/build

# LuckPerms groups that make up the team.
ranks:
  builder: builder
  head-builder: headbuilder

plots:
  # Must not be "world". That folder is the survival snapshot, not the plot grid.
  world: plots
  size: 128
  road: 10
  ground-y: 64
  max-per-builder: 1
  max-per-head-builder: 3

submissions:
  # Include the ground layer (paths, gardens, ponds) when a whole plot is submitted.
  include-ground: true
