# Paper 26.1+ stores these dimensions inside the level folder, not as sibling directories:
#   world/dimensions/minecraft/overworld
#   world/dimensions/minecraft/the_nether
#   world/dimensions/minecraft/the_end
# The keys are those dimension ids. legacy-world-name is the Bukkit world name
# (world, world_nether, world_the_end), which commands still use. Survival's
# Multiverse file uses the same names on the 26.1 layout. Do not point these
# entries at a separate world_nether or world_the_end folder.
minecraft:overworld:
  adjust-spawn: true
  alias: ''
  allow-advancement-grant: true
  allow-flight: true
  allow-weather: true
  anchor-respawn: true
  auto-heal: true
  auto-load: true
  bed-respawn: true
  biome: ''
  difficulty: peaceful
  entry-fee:
    enabled: false
    amount: 0.0
    currency: '@vault-economy'
  gamemode: creative
  generator: ''
  hidden: false
  hunger: false
  keep-spawn-in-memory: false
  meta: {}
  player-limit: -1
  portal-form: all
  pvp: false
  respawn-world: ''
  scale: 1.0
  spawn-location:
    ==: MVSpawnLocation
    x: 0.0
    y: 109.0
    z: 0.0
    pitch: 0.0
    yaw: 0.0
  spawning:
    monster:
      spawn: false
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    animal:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    water_animal:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    water_ambient:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    water_underground_creature:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    ambient:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    axolotl:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
    misc:
      spawn: true
      tick-rate: '@unset'
      spawn-limit: '@unset'
      exceptions: []
  world-blacklist: []
  read-only:
    environment: normal
    generator-settings: ''
    legacy-world-name: world
    seed: -3734445427701295366
  version: 1.3
