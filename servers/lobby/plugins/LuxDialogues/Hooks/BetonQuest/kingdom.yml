Settings:
  typing-speed: 1
  range: 5
  effect: Slowness
  answer-numbers: true
  prevent-exit: false
  prevent-skip: false
  character-name: true
  character-image: true
  background-fog: true
  npc-focus: false

Sounds:
  typing:
    id: luxdialogues:luxdialogues.sounds.typing
    source: MASTER
    volume: 1.0
    pitch: 1.0
  selection:
    id: luxdialogues:luxdialogues.sounds.selection
    source: MASTER
    volume: 1.0
    pitch: 1.0

Offsets:
  name: 0
  name-background: 20
  dialogue-background: 0
  dialogue-line: 10
  answer-background: 140
  answer-line: 13
  arrow: -7
  character: -16
  information: 27

Images:
  character-background: kingdom-character
  arrow: kingdom-hand
  dialogue-background: kingdom-dialogue
  answer-background: kingdom-answer
  name-start: kingdom-name-start
  name-mid: kingdom-name-mid
  name-end: kingdom-name-end
  fog: fog

Colors:
  name: '#f2e399'
  name-background: '#ffffff'
  dialogue: '#f2e399'
  dialogue-background: '#ffffff'
  answer: '#f2e399'
  answer-background: '#ffffff'
  character-background: '#ffffff'
  arrow: '#cdff29'
  selected: '#f2e399'
  fog: '#000000'
  information: '#ffffff'

