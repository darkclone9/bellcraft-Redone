# Player should have appropriate permission node to use particular kit: cmi.kit.[kitName]
# cmi.kit.newbie will allow to use newbie kit
# Possible custom variables: {USERNAME} {DISPLAYNAME} {WORLDNAME} {KITNAME} {RANDOMPLAYER}
# Edit kits ingame with /cmi kiteditor to avoid formating issues
# Commands support specialized command format
#
# ---------------------------------------------------------------------------
# Bellcraft survival kit ladder. Vanilla items only - no custom or RPG items
# live on this server.
#
#   starter   everyone   once      enough to survive the first night after /rtp
#   daily     everyone   24h       small top-up, the baseline everyone gets
#   vip       vip        24h       daily, but cooked food and real iron
#   vipplus   vip+       24h       more of everything, plus a diamond
#   elite     donator    24h       the top of the ladder
#
# Each tier is a strict superset of the one below it, so the progression reads
# clearly in /kit. Ranks inherit downward (vip+ -> vip -> default), so a vip+
# player can claim vip and daily too.
#
# CMI has no "one time only" kit flag - only Delay - so `starter` uses a
# 365 day cooldown, which is effectively once per player. If you ever need to
# hand it out again, that is `/cmi kitcdreset <player> starter`.
#
# Delay is in seconds: 86400 = 24h, 31536000 = 365d.
# ---------------------------------------------------------------------------

